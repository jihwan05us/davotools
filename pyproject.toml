# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "davotools"
description = "DAVOlatte's everyday TOOLS"
authors = [
  { name="Jihwan Oh", email="jihwan05us@gmail.com" },
]
version = "0.0.1"
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/*"
Issues = "https://github.com/*/issues"