# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "davotools"
description = "DAVOlatte's everyday TOOLS"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
authors = [
  { name="Jihwan Oh", email="jihwan05us@gmail.com" },
]
version = "0.0.5"
requires-python = ">=3.10"
dependencies = [
    "geojson",
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "scikit-image",
    "shapely",
    "tifffile",
    "tqdm",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/jihwan05us/davotools"
Issues = "https://github.com/jihwan05us/davotools/issues"

